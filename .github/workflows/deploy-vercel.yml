# Production deploy to Vercel (shareable URL for trade testers, e.g. Tom).
#
# One-time setup:
# 1) Vercel → New Project → import this Git repo (Framework: Vite, Root: ./, Build: npm run build, Output: dist).
# 2) Vercel → Project → Settings → Environment Variables → Production:
#    VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY (same as local .env).
# 3) GitHub → repo → Settings → Secrets and variables → Actions:
#    VERCEL_TOKEN       https://vercel.com/account/tokens
#    VERCEL_ORG_ID      Vercel → Team / User Settings → General (or from `vercel link` output)
#    VERCEL_PROJECT_ID  Project → Settings → General → Project ID
#
# Trigger: Actions → Deploy Vercel → Run workflow (after GitHub secrets are set).
# Optional: add `push: branches: [main]` here once VERCEL_* secrets exist, for auto-deploy on merge.
# Live URL: Vercel → Deployments → production domain (often https://<name>.vercel.app).

name: Deploy Vercel

on:
  workflow_dispatch:

concurrency:
  group: vercel-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@50.1.0

      - name: Deploy to production (remote build on Vercel)
        run: vercel deploy --prod --yes --token="$VERCEL_TOKEN"
